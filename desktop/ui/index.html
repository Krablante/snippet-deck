<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>SnippetDeck</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>SnippetDeck</h1>
      <div class="top-actions">
        <button id="more" class="icon-button glass-button" type="button" aria-label="More options" aria-expanded="false">⋯</button>
        <div id="menu" class="menu" hidden>
          <button id="import" type="button">Import backup…</button>
          <button id="export" type="button">Export backup…</button>
          <button id="replace-cloud" type="button" hidden>Use this device's library in cloud…</button>
          <button id="use-other" type="button" hidden>Use other device's library…</button>
          <button id="disconnect-sync" type="button" hidden>Disconnect Google Drive</button>
          <button id="reset-sync" type="button" hidden>Switch Google account…</button>
          <div class="menu-divider"></div>
          <button id="check-update" type="button">Check for updates</button>
          <div class="menu-divider"></div>
          <label class="menu-check"><input id="startup" type="checkbox"> Start at login</label>
          <div class="menu-divider"></div>
          <div class="menu-label">Appearance</div>
          <div class="themes" role="group" aria-label="Appearance">
            <button type="button" data-theme="white">Chalk</button>
            <button type="button" data-theme="black">Ink</button>
            <button type="button" data-theme="sepia">Parchment</button>
          </div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="library" aria-label="Snippet library">
        <div class="library-tools">
          <label class="search glass"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.4 4.4"/></svg><input id="search" type="search" placeholder="Search snippets" aria-label="Search snippets"></label>
          <button id="new" class="add-button" type="button" aria-label="Add snippet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
        </div>
        <div id="count" class="count"></div>
        <div class="service-row">
          <div><strong>Text expansion</strong><small id="status">Starting…</small></div>
          <label class="switch" aria-label="Text expansion enabled"><input id="active" type="checkbox" checked><span></span></label>
        </div>
        <div class="service-row sync-row">
          <div><strong>Google Drive</strong><small id="sync-status">Not connected</small></div>
          <button id="sync" class="sync-button" type="button">Connect</button>
        </div>
        <div id="update-row" class="service-row update-row" hidden>
          <div><strong>SnippetDeck <span id="update-version"></span> available</strong><small id="update-status">A newer release is ready.</small></div>
          <button id="install-update" class="sync-button" type="button">Install update</button>
        </div>
        <div id="list" class="snippet-list"></div>
        <p id="empty" class="empty" hidden>No snippets yet. Add one to get started.</p>
      </section>

      <section id="editor" class="editor" aria-label="Snippet editor" hidden>
        <div class="editor-top">
          <button id="back" class="back icon-button glass-button" type="button" aria-label="Back to library">←</button>
          <h2 id="editor-title">New snippet</h2>
          <button id="delete" class="text-button danger" type="button" hidden>Delete</button>
        </div>
        <form id="form">
          <label class="field">Trigger<input id="trigger" name="trigger" required maxlength="40" autocomplete="off" spellcheck="false" placeholder="!review"></label>
          <label class="field">Aliases <span class="optional">optional · separate with commas</span><input id="aliases" name="aliases" autocomplete="off" spellcheck="false" placeholder="rv, feedback"></label>
          <label class="field">Expansion<textarea id="expansion" name="expansion" required rows="8" placeholder="Text to insert"></textarea></label>
          <label class="enabled-row"><span>Enabled</span><span class="switch"><input id="snippet-enabled" type="checkbox" checked><span></span></span></label>
          <p id="form-error" class="error" role="alert" hidden></p>
          <button class="save-button" type="submit">Save snippet</button>
        </form>
      </section>
      <section id="welcome" class="welcome" aria-hidden="true">
        <div class="welcome-mark" aria-hidden="true">⌘</div>
        <h2>Make room for what you write.</h2>
        <p>Choose a snippet from your library.</p>
      </section>
    </main>
    <div id="notice" class="notice" role="status" hidden></div>
    <dialog id="confirm" class="confirm">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <form method="dialog" class="confirm-actions">
        <button type="submit" value="cancel">Cancel</button>
        <button id="confirm-action" type="submit" value="yes"></button>
      </form>
    </dialog>
  </div>
</body>
</html>

name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.4.1
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snippet-deck.jks"

      - name: Verify and build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/snippet-deck.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release.apk snippet-deck-${{ inputs.tag }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" "snippet-deck-${{ inputs.tag }}.apk" --generate-notes --title "SnippetDeck ${{ inputs.tag }}"

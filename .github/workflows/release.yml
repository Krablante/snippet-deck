name: Release SnippetDeck

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.8.5
        required: true
        type: string
      preview:
        description: Publish as a prerelease for device testing
        required: false
        type: boolean
        default: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${INPUT_TAG#v}"
          test "$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')" = "$VERSION"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("desktop/src-tauri/Cargo.toml", "rb"))["package"]["version"])')" = "$VERSION"
          test "$(python3 -c 'import re; print(re.search(r"versionName\s*=\s*\"([^\"]+)\"", open("app/build.gradle.kts").read()).group(1))')" = "$VERSION"
          python3 - <<'PY'
          import json, os, re, subprocess
          latest = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GH_REPO']}/releases/latest"
          ]))
          tag = latest["tag_name"]
          old = subprocess.check_output(["git", "show", f"{tag}:app/build.gradle.kts"], text=True)
          current = open("app/build.gradle.kts").read()
          code = lambda text: int(re.search(r"versionCode\s*=\s*(\d+)", text).group(1))
          version = lambda text: tuple(map(int, text.removeprefix("v").split(".")))
          if version(os.environ["INPUT_TAG"]) <= version(tag) or code(current) <= code(old):
              raise SystemExit("Release version and Android versionCode must exceed the latest stable release")
          PY
          if gh api "repos/${GH_REPO}/git/ref/tags/${INPUT_TAG}" > /dev/null 2>&1; then
            echo "Release tag already exists: $INPUT_TAG" >&2
            exit 1
          fi

      - name: Verify desktop OAuth client secret
        env:
          DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.SNIPPETDECK_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          secret = os.environ.get("DESKTOP_OAUTH_CLIENT_SECRET", "").strip()
          if not secret:
              raise SystemExit("Missing SNIPPETDECK_DESKTOP_OAUTH_CLIENT_SECRET")
          form = urllib.parse.urlencode({
              "client_id": "356275794423-basgnoa6re20s3daa4vep06l2g7fv04n.apps.googleusercontent.com",
              "client_secret": secret,
              "code": "invalid-test-code",
              "code_verifier": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              "redirect_uri": "http://127.0.0.1:9004",
              "grant_type": "authorization_code",
          }).encode()
          request = urllib.request.Request("https://oauth2.googleapis.com/token", data=form)
          try:
              urllib.request.urlopen(request, timeout=20).close()
          except urllib.error.HTTPError as error:
              # A valid client secret passes authentication; the dummy code then fails.
              if json.load(error).get("error") == "invalid_grant":
                  print("Desktop OAuth credential accepted by Google")
              else:
                  raise SystemExit("Google rejected the desktop OAuth credential")
          else:
              raise SystemExit("Unexpected success for an invalid OAuth code")
          PY

  android:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android 37 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snippet-deck.jks"

      - name: Verify and build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/snippet-deck.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Verify update compatibility
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EXPECTED_SIGNER_SHA256: 627216136dc143c9a2d4d4cc0851441e46753fc1ecd30548e25f5ebe15ae358d
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          EXPECTED_VERSION="${INPUT_TAG#v}"

          test -f "$APK"
          test "$(bash "$APKANALYZER" manifest application-id "$APK")" = "com.rrajath.expander"
          test "$(bash "$APKANALYZER" manifest version-name "$APK")" = "$EXPECTED_VERSION"
          EXPECTED_CODE=$(python3 -c 'import re; print(re.search(r"versionCode\s*=\s*(\d+)", open("app/build.gradle.kts").read()).group(1))')
          test "$(bash "$APKANALYZER" manifest version-code "$APK")" = "$EXPECTED_CODE"
          "$APKSIGNER" verify --verbose "$APK"

          ACTUAL_SIGNER_SHA256=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -oE '[[:xdigit:]]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')
          test -n "$ACTUAL_SIGNER_SHA256"
          if [ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Release signer mismatch: $ACTUAL_SIGNER_SHA256"
            exit 1
          fi

      - name: Prepare artifact
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: cp app/build/outputs/apk/release/app-release.apk "snippet-deck-${INPUT_TAG}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: snippetdeck-android
          path: snippet-deck-${{ inputs.tag }}.apk
          if-no-files-found: error

  desktop:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    with:
      official_build: true
    secrets:
      SNIPPETDECK_DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.SNIPPETDECK_DESKTOP_OAUTH_CLIENT_SECRET }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: snippetdeck-*
          path: dist
      - name: Verify release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${INPUT_TAG#v}"
          test "$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')" = "$VERSION"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("desktop/src-tauri/Cargo.toml", "rb"))["package"]["version"])')" = "$VERSION"
          test "$(python3 -c 'import re; print(re.search(r"versionName\s*=\s*\"([^\"]+)\"", open("app/build.gradle.kts").read()).group(1))')" = "$VERSION"
          mkdir dist/release
          cp "dist/snippetdeck-android/snippet-deck-${INPUT_TAG}.apk" dist/release/
          cp "dist/snippetdeck-linux-x11/SnippetDeck_${VERSION}_amd64.deb" dist/release/
          cp "dist/snippetdeck-windows/SnippetDeck_${VERSION}_x64_en-US.msi" dist/release/
          cp dist/snippetdeck-macos-arm64/*.dmg "dist/release/SnippetDeck_${VERSION}_arm64.dmg"
          cp dist/snippetdeck-macos-intel/*.dmg "dist/release/SnippetDeck_${VERSION}_intel.dmg"
          ASSETS=(
            "dist/release/snippet-deck-${INPUT_TAG}.apk"
            "dist/release/SnippetDeck_${VERSION}_amd64.deb"
            "dist/release/SnippetDeck_${VERSION}_x64_en-US.msi"
            "dist/release/SnippetDeck_${VERSION}_arm64.dmg"
            "dist/release/SnippetDeck_${VERSION}_intel.dmg"
          )
          for asset in "${ASSETS[@]}"; do test -s "$asset"; done
          (cd dist/release && sha256sum "snippet-deck-${INPUT_TAG}.apk" "SnippetDeck_${VERSION}_amd64.deb" "SnippetDeck_${VERSION}_x64_en-US.msi" "SnippetDeck_${VERSION}_arm64.dmg" "SnippetDeck_${VERSION}_intel.dmg" > SHA256SUMS.txt)
          test "$(wc -l < dist/release/SHA256SUMS.txt)" -eq 5
          gh release create "$INPUT_TAG" "${ASSETS[@]}" dist/release/SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title "SnippetDeck $INPUT_TAG" --generate-notes --notes "Install the APK on Android, the MSI on Windows, the matching DMG on macOS, or the DEB on Linux. Export a backup before updating. Desktop installers remain unsigned; macOS may require Open Anyway. Linux Wayland supports the editor; text expansion requires X11."
          # Drafts are absent from the releases/tags endpoint until published.
          RELEASE_ID=$(gh api "repos/${GH_REPO}/releases" --jq ".[] | select(.tag_name == \"${INPUT_TAG}\" and .draft == true) | .id")
          test -n "$RELEASE_ID"
          digests_ready=false
          for attempt in 1 2 3 4 5 6; do
            release_json=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}")
            if [ "$(jq '.assets | length' <<<"$release_json")" -ne 6 ]; then
              sleep 5
              continue
            fi
            digests_ready=true
            while read -r checksum asset; do
              if ! jq -e --arg name "$asset" --arg digest "sha256:$checksum" \
                '.assets | any(.name == $name and .digest == $digest)' <<<"$release_json" > /dev/null; then
                digests_ready=false
                break
              fi
            done < dist/release/SHA256SUMS.txt
            if [ "$digests_ready" = true ]; then break; fi
            sleep 5
          done
          test "$digests_ready" = true
          if [ "$PREVIEW" = "true" ]; then
            gh release edit "$INPUT_TAG" --draft=false --prerelease
          else
            gh release edit "$INPUT_TAG" --draft=false --latest
          fi

name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.5.0
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snippet-deck.jks"

      - name: Verify and build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/snippet-deck.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Verify update compatibility
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EXPECTED_SIGNER_SHA256: 627216136dc143c9a2d4d4cc0851441e46753fc1ecd30548e25f5ebe15ae358d
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          EXPECTED_VERSION="${INPUT_TAG#v}"

          test -f "$APK"
          test "$(bash "$APKANALYZER" manifest application-id "$APK")" = "com.rrajath.expander"
          test "$(bash "$APKANALYZER" manifest version-name "$APK")" = "$EXPECTED_VERSION"
          "$APKSIGNER" verify --verbose "$APK"

          ACTUAL_SIGNER_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')
          test -n "$ACTUAL_SIGNER_SHA256"
          if [ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Release signer mismatch: $ACTUAL_SIGNER_SHA256"
            exit 1
          fi

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release.apk snippet-deck-${{ inputs.tag }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" "snippet-deck-${{ inputs.tag }}.apk" --generate-notes --title "SnippetDeck ${{ inputs.tag }}"

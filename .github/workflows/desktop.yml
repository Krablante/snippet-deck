name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            artifact: linux-x11
          - os: windows-latest
            bundle: msi
            artifact: windows
          - os: macos-latest
            bundle: dmg
            artifact: macos-arm64
          - os: macos-15-intel
            bundle: dmg
            artifact: macos-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxtst-dev libxdo-dev patchelf
      - name: Build installer
        env:
          SNIPPETDECK_DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.SNIPPETDECK_DESKTOP_OAUTH_CLIENT_SECRET }}
        run: npx --yes @tauri-apps/cli@2.11.5 build --bundles ${{ matrix.bundle }} --ci --no-sign -- --locked
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: snippetdeck-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 14

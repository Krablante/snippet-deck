name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            artifact: linux-x11
          - os: windows-latest
            bundle: msi
            artifact: windows
          - os: macos-latest
            bundle: dmg
            artifact: macos-arm64
          - os: macos-15-intel
            bundle: dmg
            artifact: macos-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxtst-dev libxdo-dev patchelf
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2.11.5 build --bundles ${{ matrix.bundle }} --ci --no-sign -- --locked
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: snippetdeck-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snippetdeck-*
          path: dist
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv dist/snippetdeck-macos-arm64/*.dmg dist/snippetdeck-macos-arm64/SnippetDeck_0.1.0_arm64.dmg
          mv dist/snippetdeck-macos-intel/*.dmg dist/snippetdeck-macos-intel/SnippetDeck_0.1.0_intel.dmg
          gh release create desktop-v0.1.0 dist/snippetdeck-linux-x11/*.deb dist/snippetdeck-windows/*.msi dist/snippetdeck-macos-arm64/*.dmg dist/snippetdeck-macos-intel/*.dmg --prerelease --target "${{ github.sha }}" --title "SnippetDeck Desktop 0.1.0" --notes "Desktop preview for Windows, Linux X11 and macOS. Local snippets, compatible Android backups, no automatic sync. macOS is unsigned and requires manual Gatekeeper approval."
